# ==========================
# 1. 基础设置 (General)
# ==========================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g set-clipboard on

# 窗口和面板索引从 1 开始
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

# 前缀键: Ctrl + Space
unbind C-b
set -g prefix C-Space

# ==========================
# 2. 插件列表 (Plugins)
# ==========================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# --- 会话持久化 (Session Management) ---
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ==========================
# 3. 插件配置 (Plugin Config)
# ==========================
# 自动恢复上次的会话 (Auto Restore)
set -g @continuum-restore 'on'

# 恢复 Neovim 的 Session (可选)
set -g @resurrect-strategy-nvim 'session'

# ==========================
# 4. 主题设置 (Theme: Tokyo Night — 手动配置)
# ==========================
# Tokyo Night 色板 (macOS bash 3.2 不支持 declare -A，插件无法运行，手动配色)
TN_BG="#1A1B26"
TN_FG="#a9b1d6"
TN_BLACK="#414868"
TN_BLUE="#7aa2f7"
TN_CYAN="#7dcfff"
TN_GREEN="#73daca"
TN_MAGENTA="#bb9af7"
TN_RED="#f7768e"
TN_WHITE="#c0caf5"
TN_YELLOW="#e0af68"
TN_BBLACK="#2A2F41"
TN_BGREEN="#41a6b5"
TN_BRED="#ff9e64"

# 状态栏
set -g status-style "bg=${TN_BG}"
set -g status-left-length 80
set -g status-right-length 150

# 消息样式
set -g message-style "bg=${TN_BLUE},fg=${TN_BG}"
set -g message-command-style "fg=${TN_WHITE},bg=${TN_BLACK}"

# 面板边框
set -g pane-border-style "fg=${TN_BBLACK}"
set -g pane-active-border-style "fg=${TN_BLUE}"
set -g pane-border-status off

# 模式样式
set -g mode-style "fg=${TN_BGREEN},bg=${TN_BBLACK}"

# 左侧状态栏: 会话名
set -g status-left "#[fg=${TN_BBLACK},bg=${TN_BLUE},bold] #{?client_prefix,󰠠 ,#[dim]󰤂 }#[bold,nodim]#S #[bg=${TN_BG}] "

# 窗口样式
set -g window-status-format "#[fg=${TN_FG},bg=${TN_BG}]  #I #W#[nobold,dim]#[fg=${TN_YELLOW}]#{?window_last_flag,󰁯  , }"
set -g window-status-current-format "#[fg=${TN_GREEN},bg=${TN_BBLACK}]  #I #[fg=${TN_FG},bold,nodim]#W#[nobold]#{?window_zoomed_flag, Z,}#[fg=${TN_YELLOW}]#{?window_last_flag,󰁯  , }"
set -g window-status-separator ""

# 右侧状态栏: 日期时间
set -g status-right "#[fg=${TN_GREEN},bg=${TN_BG}] %Y-%m-%d ❬ %H:%M "

# ==========================
# 5. 按键映射 (Keybinds)
# ==========================
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# ==========================
# 6. 初始化 (Init)
# ==========================
run '~/.tmux/plugins/tpm/tpm'
